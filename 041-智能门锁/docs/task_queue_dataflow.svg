<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="780" viewBox="0 0 1280 780" font-family="Microsoft YaHei, sans-serif">
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5A6B7B"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1280" height="780" fill="#F5F7FA"/>

  <!-- title -->
  <text x="40" y="42" font-size="24" font-weight="bold" fill="#122133">任务 — 队列 — 数据流</text>
  <text x="40" y="68" font-size="13" fill="#5A6B7B">FreeRTOS 并发模型：5 个任务 + 6 个队列，access_task 是唯一决策中心</text>

  <!-- top strip: 5 tasks -->
  <g font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">
    <rect x="120" y="86" width="190" height="56" rx="8" fill="#2E8B57"/>
    <text x="215" y="112">input_task</text><text x="215" y="132" font-size="11" font-weight="normal">优先级 3 · 采输入</text>

    <rect x="330" y="86" width="190" height="56" rx="8" fill="#1F6FB2"/>
    <text x="425" y="112">access_task</text><text x="425" y="132" font-size="11" font-weight="normal">优先级 4 · 决策中心</text>

    <rect x="540" y="86" width="190" height="56" rx="8" fill="#8E44AD"/>
    <text x="635" y="112">network_task</text><text x="635" y="132" font-size="11" font-weight="normal">优先级 2 · MQTT</text>

    <rect x="750" y="86" width="190" height="56" rx="8" fill="#CB8E00"/>
    <text x="845" y="112">log_task</text><text x="845" y="132" font-size="11" font-weight="normal">优先级 1 · 写日志</text>

    <rect x="960" y="86" width="190" height="56" rx="8" fill="#CB8E00"/>
    <text x="1055" y="112">ui_task</text><text x="1055" y="132" font-size="11" font-weight="normal">优先级 1 · 刷屏</text>
  </g>

  <!-- 6 rows: producer -> queue -> consumer -->
  <!-- row geometry: producer x=300 w=200 ; queue x=560 w=230 ; consumer x=850 w=200 -->
  <g font-size="13" fill="#122133">
    <!-- row template repeated -->
    <!-- R1 input -> input_queue -> access -->
    <g transform="translate(0,170)">
      <rect x="300" y="0" width="200" height="52" rx="7" fill="#E3F2E9" stroke="#2E8B57" stroke-width="1.5"/>
      <text x="400" y="32" text-anchor="middle" font-weight="bold">input_task</text>
      <rect x="560" y="0" width="230" height="52" rx="26" fill="#EAF4FB" stroke="#1F6FB2" stroke-width="1.5"/>
      <text x="675" y="32" text-anchor="middle" font-weight="bold" fill="#1F6FB2">input_queue</text>
      <rect x="850" y="0" width="200" height="52" rx="7" fill="#E3EEF7" stroke="#1F6FB2" stroke-width="1.5"/>
      <text x="950" y="32" text-anchor="middle" font-weight="bold">access_task</text>
      <line x1="500" y1="26" x2="558" y2="26" stroke="#5A6B7B" stroke-width="2" marker-end="url(#ah)"/>
      <line x1="790" y1="26" x2="848" y2="26" stroke="#5A6B7B" stroke-width="2" marker-end="url(#ah)"/>
      <text x="530" y="18" text-anchor="middle" font-size="10" fill="#5A6B7B">board_input_event</text>
    </g>
    <!-- R2 network -> remote_queue -> access -->
    <g transform="translate(0,256)">
      <rect x="300" y="0" width="200" height="52" rx="7" fill="#F3E9F8" stroke="#8E44AD" stroke-width="1.5"/>
      <text x="400" y="32" text-anchor="middle" font-weight="bold">network_task</text>
      <rect x="560" y="0" width="230" height="52" rx="26" fill="#EAF4FB" stroke="#1F6FB2" stroke-width="1.5"/>
      <text x="675" y="32" text-anchor="middle" font-weight="bold" fill="#1F6FB2">remote_queue</text>
      <rect x="850" y="0" width="200" height="52" rx="7" fill="#E3EEF7" stroke="#1F6FB2" stroke-width="1.5"/>
      <text x="950" y="32" text-anchor="middle" font-weight="bold">access_task</text>
      <line x1="500" y1="26" x2="558" y2="26" stroke="#5A6B7B" stroke-width="2" marker-end="url(#ah)"/>
      <line x1="790" y1="26" x2="848" y2="26" stroke="#5A6B7B" stroke-width="2" marker-end="url(#ah)"/>
      <text x="530" y="18" text-anchor="middle" font-size="10" fill="#5A6B7B">remote_command</text>
    </g>
    <!-- R3 access -> ui_queue -> ui -->
    <g transform="translate(0,342)">
      <rect x="300" y="0" width="200" height="52" rx="7" fill="#E3EEF7" stroke="#1F6FB2" stroke-width="1.5"/>
      <text x="400" y="32" text-anchor="middle" font-weight="bold">access_task</text>
      <rect x="560" y="0" width="230" height="52" rx="26" fill="#EAF4FB" stroke="#1F6FB2" stroke-width="1.5"/>
      <text x="675" y="32" text-anchor="middle" font-weight="bold" fill="#1F6FB2">ui_queue</text>
      <rect x="850" y="0" width="200" height="52" rx="7" fill="#FBF0D6" stroke="#CB8E00" stroke-width="1.5"/>
      <text x="950" y="32" text-anchor="middle" font-weight="bold">ui_task</text>
      <line x1="500" y1="26" x2="558" y2="26" stroke="#5A6B7B" stroke-width="2" marker-end="url(#ah)"/>
      <line x1="790" y1="26" x2="848" y2="26" stroke="#5A6B7B" stroke-width="2" marker-end="url(#ah)"/>
      <text x="530" y="18" text-anchor="middle" font-size="10" fill="#5A6B7B">app_ui_message</text>
    </g>
    <!-- R4 access -> log_queue -> log -->
    <g transform="translate(0,428)">
      <rect x="300" y="0" width="200" height="52" rx="7" fill="#E3EEF7" stroke="#1F6FB2" stroke-width="1.5"/>
      <text x="400" y="32" text-anchor="middle" font-weight="bold">access_task</text>
      <rect x="560" y="0" width="230" height="52" rx="26" fill="#EAF4FB" stroke="#1F6FB2" stroke-width="1.5"/>
      <text x="675" y="32" text-anchor="middle" font-weight="bold" fill="#1F6FB2">log_queue</text>
      <rect x="850" y="0" width="200" height="52" rx="7" fill="#FBF0D6" stroke="#CB8E00" stroke-width="1.5"/>
      <text x="950" y="32" text-anchor="middle" font-weight="bold">log_task</text>
      <line x1="500" y1="26" x2="558" y2="26" stroke="#5A6B7B" stroke-width="2" marker-end="url(#ah)"/>
      <line x1="790" y1="26" x2="848" y2="26" stroke="#5A6B7B" stroke-width="2" marker-end="url(#ah)"/>
      <text x="530" y="18" text-anchor="middle" font-size="10" fill="#5A6B7B">event_log_record</text>
    </g>
    <!-- R5 access -> notify_queue -> network -->
    <g transform="translate(0,514)">
      <rect x="300" y="0" width="200" height="52" rx="7" fill="#E3EEF7" stroke="#1F6FB2" stroke-width="1.5"/>
      <text x="400" y="32" text-anchor="middle" font-weight="bold">access_task</text>
      <rect x="560" y="0" width="230" height="52" rx="26" fill="#EAF4FB" stroke="#1F6FB2" stroke-width="1.5"/>
      <text x="675" y="32" text-anchor="middle" font-weight="bold" fill="#1F6FB2">notify_queue</text>
      <rect x="850" y="0" width="200" height="52" rx="7" fill="#F3E9F8" stroke="#8E44AD" stroke-width="1.5"/>
      <text x="950" y="32" text-anchor="middle" font-weight="bold">network_task</text>
      <line x1="500" y1="26" x2="558" y2="26" stroke="#5A6B7B" stroke-width="2" marker-end="url(#ah)"/>
      <line x1="790" y1="26" x2="848" y2="26" stroke="#5A6B7B" stroke-width="2" marker-end="url(#ah)"/>
      <text x="530" y="18" text-anchor="middle" font-size="10" fill="#5A6B7B">board_notification</text>
    </g>
    <!-- R6 ui -> log_request_queue -> log -->
    <g transform="translate(0,600)">
      <rect x="300" y="0" width="200" height="52" rx="7" fill="#FBF0D6" stroke="#CB8E00" stroke-width="1.5"/>
      <text x="400" y="32" text-anchor="middle" font-weight="bold">ui_task/菜单</text>
      <rect x="560" y="0" width="230" height="52" rx="26" fill="#EAF4FB" stroke="#1F6FB2" stroke-width="1.5"/>
      <text x="675" y="32" text-anchor="middle" font-weight="bold" fill="#1F6FB2">log_request_queue</text>
      <rect x="850" y="0" width="200" height="52" rx="7" fill="#FBF0D6" stroke="#CB8E00" stroke-width="1.5"/>
      <text x="950" y="32" text-anchor="middle" font-weight="bold">log_task</text>
      <line x1="500" y1="26" x2="558" y2="26" stroke="#5A6B7B" stroke-width="2" marker-end="url(#ah)"/>
      <line x1="790" y1="26" x2="848" y2="26" stroke="#5A6B7B" stroke-width="2" marker-end="url(#ah)"/>
      <text x="530" y="18" text-anchor="middle" font-size="10" fill="#5A6B7B">uint32 序号</text>
    </g>
  </g>

  <!-- legend -->
  <g font-size="12" fill="#122133">
    <rect x="40" y="700" width="16" height="16" rx="3" fill="#1F6FB2"/>
    <text x="64" y="713">任务（蓝=决策/绿=采集/紫=网络/橙=执行）</text>
    <rect x="430" y="700" width="16" height="16" rx="8" fill="#EAF4FB" stroke="#1F6FB2" stroke-width="1.5"/>
    <text x="454" y="713">队列（圆角胶囊 = xQueueCreateStatic，静态缓冲）</text>
    <text x="850" y="713" fill="#C0392B" font-weight="bold">access_task 被 4 条队列指向 = 唯一决策中心</text>
  </g>
</svg>
